aid: brisk-health
name: Brisk Health
description: 'Brisk Health is a Colorado urgent care and primary care provider operating
  a cash-pay clinic in the Denver metro area plus a fleet of mobile vehicles staffed
  by acute care clinicians for in-home visits, with same-day visits advertised from
  $49 and no insurance required. In October 2025 it announced a move from its Lakewood
  location to a purpose-built facility in Littleton, Colorado. Brisk Health is a
  healthcare services business rather than a software vendor: it publishes no
  developer program, no public API documentation, no SDKs, and no machine-readable
  specification of any kind. Its patient-facing mobile app has been delisted from
  both the Apple App Store and Google Play, and both of its brand domains now serve
  parked-domain error pages.'
