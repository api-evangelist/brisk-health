  note: >-
    Machine-readable documents DO exist on the live Brisk Health host, but every one
    of them is a Wix platform default rather than something Brisk Health authored or
    opted into. Wix documents that every site it hosts is "its own MCP server out of
    the box ... with no additional setup required" and that it "automatically
    generates and maintains your LLMs.txt file". These are recorded here, outside
    common[], deliberately: wiring them as MCPServer / LLMsTxt / WellKnown pointers
    would credit Brisk Health with an agent-readiness posture the company did not
    build and does not maintain. The artifacts are kept because the endpoint is
    genuinely live and its behavior is worth documenting — not as evidence of a
    provider API program.
